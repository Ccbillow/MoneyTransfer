server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
        - id: moneytransfer-service
          uri: lb://moneytransfer-service
          predicates:
            - Path=/api/transfer/**

eureka:
  client:
    service-url:
      defaultZone: http://eureka-service:8761/eureka/
